plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation("thedarkcolour:kotlinforforge-neoforge:$kotlin_for_forge") {
        exclude(group: "net.neoforged.fancymodloader", module: "loader")
    }

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
	// i'm going to have a migraine if that was causing the error

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // these files were obtained from the Hex Casting 1.21 pre-release,
    // discoverable on the Hex Casting Discord.
    modImplementation files("libs/hexcasting-neoforge-1.21.1-0.12.0-devel-pre-65.jar")
    modImplementation files("libs/paucal-0.7.1-pre-27+1.21.1-neoforge.jar")
	modImplementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli-NEOFORGE-SNAPSHOT")
	modImplementation("com.samsthenerd.inline:inline-neoforge:$minecraft_version-$inline")
    modImplementation("com.illusivesoulworks.caelus:caelus-neoforge:$caelus+$minecraft_version")

    // "Required due to issues with JIJ dependency resolving in arch or something"
    // --yoinked from hex 1.21.1's neoforge side
    forgeRuntimeLibrary("org.jetbrains.kotlin:kotlin-reflect:2.1.20")
    forgeRuntimeLibrary("org.jetbrains.kotlin:kotlin-stdlib:2.1.20")
    forgeRuntimeLibrary("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.20")
    forgeRuntimeLibrary("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.20")
    forgeRuntimeLibrary("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2")
    forgeRuntimeLibrary("org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.10.2")
    forgeRuntimeLibrary("org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1")
    forgeRuntimeLibrary("org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
