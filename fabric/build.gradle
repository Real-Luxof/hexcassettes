plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // these files were obtained from the Hex Casting 1.21 pre-release,
    // discoverable on the Hex Casting Discord.
    modImplementation files("libs/hexcasting-fabric-1.21.1-0.12.0-devel-pre-65.jar")
    modImplementation files("libs/paucal-0.7.1-pre-27+1.21.1-fabric.jar")
    implementation("net.fabricmc:fabric-language-kotlin:$fabric_language_kotlin")
	modImplementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli-FABRIC-SNAPSHOT")
	modImplementation("com.samsthenerd.inline:inline-fabric:$minecraft_version-$inline")
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$cardinal_components"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$cardinal_components"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-item:$cardinal_components"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-block:$cardinal_components"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
