architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

	compileOnly("org.jetbrains.kotlin:kotlin-stdlib:1.9.22")
    // these files were obtained from the Hex Casting 1.21 pre-release,
    // discoverable on the Hex Casting Discord.
    modImplementation files("libs/hexcasting-fabric-1.21.1-0.12.0-devel-pre-65.jar")
    modImplementation files("libs/paucal-0.7.1-pre-27+1.21.1-fabric.jar")
	modImplementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli-FABRIC-SNAPSHOT")
	modImplementation("com.samsthenerd.inline:inline-fabric:$minecraft_version-$inline")
}
